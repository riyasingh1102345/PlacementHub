<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/build-resume.css">

</head>
<body data-step="3">

    <section class="builder">

    <div class="container">

        <div class="builder-box">

            <aside class="builder-sidebar">

                <h2>Resume<span>Forge</span></h2>

                <ul class="steps-list">

                    <li data-step="1">
                 <span class="step-number">01</span>
                <span class="step-text">Basic Details</span>
                </li>

<li data-step="2">
    <span class="step-number">02</span>
    <span class="step-text">Education</span>
</li>

<li data-step="3">
    <span class="step-number">03</span>
    <span class="step-text">Experience</span>
</li>

<li data-step="4">
    <span class="step-number">04</span>
    <span class="step-text">Projects</span>
</li>

<li data-step="5">
    <span class="step-number">05</span>
    <span class="step-text">Skills</span>
</li>

<li data-step="6">
    <span class="step-number">06</span>
    <span class="step-text">Achievements</span>
</li>

<li data-step="7">
    <span class="step-number">07</span>
    <span class="step-text">Finalize</span>
</li>

                </ul>

            </aside>
    
    <main class="builder-content">

    <div class="progress-area">

        <p>Step 3 of 7</p>

        <div class="progress-bar">
            <div class="progress-fill" style="width:43%;"></div>
        </div>

    </div>

    <h1>
        Tell us about your
        <span>work experience.</span>
    </h1>

    <p>
        Add internships, jobs or freelance experience. You can always edit it later.
    </p>

    <form>

        <div id="experienceContainer"> 

        <div class="experience-card">

    <div class="card-header">

        <h2 class="card-title">Experience 1</h2>

        <button type="button" class="delete-btn">
            🗑 Delete
        </button>

    </div>

        <div class="form-grid">

            <div class="form-group">
                <label>Job Title</label>
                <input type="text" placeholder="Software Engineer Intern">
            </div>

            <div class="form-group">
                <label>Company Name</label>
                <input type="text" placeholder="Microsoft">
            </div>

            <div class="form-group">
                <label>Employment Type</label>

                <select>
                    <option>Select</option>
                    <option>Internship</option>
                    <option>Full-Time</option>
                    <option>Part-Time</option>
                    <option>Freelance</option>
                    <option>Contract</option>
                </select>

            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" placeholder="Bengaluru, India">
            </div>

            <div class="form-group">
                <label>Start Month</label>

                <select>
                    <option>Select Month</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

            </div>

            <div class="form-group">
                <label>Start Year</label>

                <select>
                    <option>Select Year</option>
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                    <option>2022</option>
                </select>

            </div>

            <div class="form-group">
                <label>End Month</label>

                <select>
                    <option>Select Month</option>
                    <option>Present</option>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                    <option>July</option>
                    <option>August</option>
                    <option>September</option>
                    <option>October</option>
                    <option>November</option>
                    <option>December</option>
                </select>

            </div>

            <div class="form-group">
                <label>End Year</label>

                <select>
                    <option>Select Year</option>
                    <option>Present</option>
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                    <option>2023</option>
                </select>

            </div>

        </div>

        <div class="checkbox-group">

            <input
                type="checkbox"
                id="present">

            <label for="present">
                I currently work here
            </label>

        </div>

        <div class="form-group">

            <label>Responsibilities & Achievements</label>

            <textarea
                rows="4"
                placeholder="• Developed a MERN web application used by 500+ students.

• Improved website performance by 35%.

• Collaborated with a team of 4 developers using Git & GitHub."></textarea>

        </div>

        </div>

    </div>

    <button
        type="button"
        class="add-btn"
        id="addExperience">

        + Add Another Experience

    </button>

    <div class="builder-actions">

    <button
        type="button"
        class="secondary-btn"
        id="backBtn">

        ← Back

    </button>

    <button
        type="button"
        class="primary-btn"
        id="continueBtn">

        Continue →

    </button>

</div>

</form>

</main>   

</section>

<script src="../js/common/sidebar.js"></script>
<script src="../js/pages/experience.js"></script>

</body>
</html>
