<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education | ResumeForge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/build-resume.css">

</head>

<body>

<section class="builder">

    <div class="container">

        <div class="builder-box">

            <aside class="builder-sidebar">

                <h2>Resume<span>Forge</span></h2>

                <ul>

                    <li class="completed">
                        <span class="step-number">01</span>
                        <span class="step-text">Basic Details</span>
                    </li>

                    <li class="active">
                        <span class="step-number">02</span>
                        <span class="step-text">Education</span>
                    </li>

                    <li>
                        <span class="step-number">03</span>
                        <span class="step-text">Experience</span>
                    </li>

                    <li>
                        <span class="step-number">04</span>
                        <span class="step-text">Projects</span>
                    </li>

                    <li>
                        <span class="step-number">05</span>
                        <span class="step-text">Skills</span>
                    </li>

                    <li>
                        <span class="step-number">06</span>
                        <span class="step-text">Achievements</span>
                    </li>

                    <li>
                        <span class="step-number">07</span>
                        <span class="step-text">Finalize</span>
                    </li>

                </ul>

            </aside>

            <main class="builder-content">

                <div class="progress-area">

                    <p>Step 2 of 7</p>

                    <div class="progress-bar">
                        <div class="progress-fill step-two"></div>
                    </div>

                </div>

                <h1>
                    Tell us about your
                    <span>education.</span>
                </h1>

                <p>
                    Add your educational qualifications. You can always edit them later.
                </p>

                <form>

                    <div class="form-grid">

                        <div class="form-group">

                            <label>Degree</label>

                            <input
                                type="text"
                                placeholder="Bachelor of Technology">

                        </div>

                        <div class="form-group">

                            <label>Field of Study</label>

                            <input
                                type="text"
                                placeholder="Computer Science & Engineering">

                        </div>

                        <div class="form-group">

                            <label>College / University</label>

                            <input
                                type="text"
                                placeholder="xyz college">

                        </div>

                        <div class="form-group">

                            <label>Location</label>

                            <input
                                type="text"
                                placeholder="Mumbai, Maharashtra">

                        </div>

                        <div class="form-group">

                            <label>Start Year</label>

                        <select>

                            <option selected disabled>Select Year</option>
                            <option>2027</option>
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>2023</option>
                            <option>2022</option>
                            <option>2021</option>
                            <option>2020</option>

                        </select>

                        </div>

                        <div class="form-group">

                            <label>End Year</label>

                        <select>

                            <option selected disabled>Select Year</option>
                            <option>2027</option>
                            <option>2028</option>
                            <option>2029</option>
                            <option>2030</option>
                            <option>2031</option>
                            <option>2032</option>

                        </select>    

                        </div>

                    </div>

                    <div class="form-group">

                        <label>CGPA / Percentage</label>

                        <input
                            type="text"
                            placeholder="8.2 CGPA">

                    </div>

                    <div class="form-group">

                        <label>Description (Optional)</label>

                        <textarea
                            rows="5"
                            placeholder="Mention relevant coursework, academic achievements, extracurricular activities or anything worth highlighting."></textarea>

                    </div>

                    <button
                        type="button"
                        class="add-btn">

                        + Add Another Education

                    </button>

                    <div class="builder-actions">

                        <button
                            type="button"
                            class="secondary-btn">

                            ← Back

                        </button>

                        <button
                            type="submit"
                            class="primary-btn">

                            Continue →

                        </button>

                    </div>

                </form>

            </main>

        </div>

    </div>

</section>

</body>
</html>
