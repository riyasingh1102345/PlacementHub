<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stack</title>

<link rel="stylesheet" href="../css/stack-sheet.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<section class="sheet-hero">

    <span class="hero-tag">
        FOUNDATION MODULE
    </span>

    <h1>
        Arrays
    </h1>

    <p>
        Learn hashing, sliding window, prefix sums,
        two pointers and Amazon's most asked patterns.
    </p>

    <div class="progress-box">

        <div class="progress-top">

            <span>Progress</span>

           <span id="progress-count"></span>

        </div>

        <div class="progress-bar">
             <div class="progress-fill" id="progress-fill"></div>
        </div>

    </div>

    <div class="search-box">
           <input type="text" id="search-input" placeholder="Search questions..."/>
           </div>

</section>

<section class="tier-section">

<section id="easy-section">
    <h2 class="level-heading easy-heading">🟢 Easy (Foundation)</h2>
    <div id="beginner-list" class="question-grid"></div>
</section>

<section id="medium-section">
    <h2 class="level-heading medium-heading">🟡 Medium (Interview Ready)</h2>
    <div id="intermediate-list" class="question-grid"></div>
</section>

<section id="hard-section">
    <h2 class="level-heading hard-heading">🔴 Hard (Advanced)</h2>
    <div id="advanced-list" class="question-grid"></div>
</section>

</section>

<script src="../data/stack-data.js"></script>
<script src="../js/stack-sheet.js"></script>

</body>
</html>
