<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tracker</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../css/tracker.css">
</head>
<body>

    <section class="tracker">

        <h1>DSA Tracker</h1>
        <p>Track your coding preparation journey.</p>

        <div class="progress-card">
            <h2>Overall Progress</h2>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p>120 / 250 Questions Solved</p>
        </div>

        <div class="topics-grid">

            <a href="arrays.html" class="topic-link">
                <div class="topic-card">
                <h3>Arrays</h3>
                <p>15 / 30 Solved</p>
           </div>
            </a>
            
            <a href="strings.html" class="topic-link">
            <div class="topic-card">
                <h3>Strings</h3>
                <p>10 / 25 Solved</p>
            </div>
            </a>
            
            <div class="topic-card">
                <h3>Linked List</h3>
                <p>18 / 20 Solved</p>
            </div>

            <div class="topic-card">
                <h3>Trees</h3>
                <p>8 / 40 Solved</p>
            </div>

        </div>

    </section>

</body>
</html>
