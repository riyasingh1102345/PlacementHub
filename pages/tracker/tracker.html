<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Tracker</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./tracker.css">
</head>
<body>

    <section class="tracker">

        <h1>DSA Tracker</h1>
        <p>Track your coding preparation journey.</p>

        <div class="progress-card">
            <h2>Overall Progress</h2>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <p id="overall-progress">0 / 248 Questions Solved</p>
        </div>

        <div class="topics-grid">

            <a href="arrays.html" class="topic-link">
            <div class="topic-card">
                <h3>Arrays</h3>
                <p id="arrays-progress">0 / 40 Solved</p>
            </div>
            </a>
            
            <a href="strings.html" class="topic-link">
            <div class="topic-card">
                <h3>Strings</h3>
                <p id="strings-progress" >0 / 14 Solved</p>
            </div>
            </a>

            <a href="linkedlist.html" class="topic-link">
            <div class="topic-card">
                <h3>Linked List</h3>
                <p id="linkedlist-progress">0 / 40 Solved</p>
            </div>
            </a>
            
            <a href="stack.html" class="topic-link">
            <div class="topic-card">
                <h3>Stack</h3>
                <p id="stack-progress">0 / 19 Solved</p>
            </div>
            </a>

            <a href="queue.html" class="topic-link">
            <div class="topic-card">
                <h3>Queue</h3>
                <p id="queue-progress">0 / 35 Solved</p>
            </div>
            </a>

            <a href="trees.html" class="topic-link">
            <div class="topic-card">
                <h3>Trees</h3>
                <p id="trees-progress">0 / 30 Solved</p>
            </div>
            </a>

            <a href="graphs.html" class="topic-link">
            <div class="topic-card">
                <h3>Graphs</h3>
                <p id="graphs-progress">0 / 35 Solved</p>
            </div>
            </a>

            <a href="dp.html" class="topic-link">
            <div class="topic-card">
                <h3>Dynamic Programming</h3>
                <p id="dp-progress">0 / 35 Solved</p>
            </div>
            </a>

        </div>

    </section>

    <script src="../../js/tracker.js"></script>

</body>
</html>
